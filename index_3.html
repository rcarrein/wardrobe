<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wardrobe</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:#111;font:16px/1.3 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
#bar{flex:none;display:flex;align-items:center;height:52px;padding:0 4px 0 14px;border-bottom:1px solid #eee;background:#fff;z-index:5}
#filterBtn{flex:1;min-width:0;height:100%;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{flex:none;width:44px;height:44px;font-size:26px;line-height:44px;text-align:center}
#panel{display:none;background:#fff;border-bottom:1px solid #eee;overflow-y:auto;padding:4px 8px 8px}
#panel.open{display:block}
#app.view #panel{position:absolute;top:52px;left:0;right:0;max-height:70dvh;z-index:4;box-shadow:0 10px 24px rgba(0,0,0,.14)}
#app.tag #panel{flex:none;max-height:44dvh}
#shade{display:none;position:absolute;inset:52px 0 0;z-index:3}
#app.view #panel.open~#shade{display:block}
#rows{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
#rows.manage{grid-template-columns:1fr}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px}
.row input{width:22px;height:22px;flex:none;margin:0;accent-color:#111}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:14px;padding:8px 6px;color:#555}
#pfoot{display:flex;gap:6px;padding-top:6px;border-top:1px solid #f1f1f1;margin-top:4px}
#pfoot button{flex:1;height:40px;font-size:14px;font-weight:600;border-radius:8px;background:#f4f4f4}
#track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 7vw;scrollbar-width:none;background:#fff}
#track::-webkit-scrollbar{display:none}
.slide{flex:0 0 86vw;height:100%;padding:10px 4px;scroll-snap-align:center;scroll-snap-stop:always;will-change:transform,opacity}
.slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#empty{display:none;position:absolute;inset:52px 0 64px;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#666;text-align:center;padding:24px}
#emptyBtn{padding:11px 20px;border-radius:10px;background:#111;color:#fff;font-weight:600}
.actions{flex:none;display:none;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #eee;background:#fff}
.actions button{flex:1;height:44px;border-radius:10px;font-weight:600;background:#f4f4f4}
.actions button:disabled{opacity:.35}
#delBtn{color:#b00020}
#doneBtn{background:#111;color:#fff}
#menuBox{display:none;position:absolute;top:50px;right:6px;z-index:6;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);overflow:hidden}
#menuBox.open{display:block}
#menuBox button{display:block;width:100%;padding:14px 22px;text-align:left}
#modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:24px}
#modal.open{display:flex}
#card{width:100%;max-width:340px;background:#fff;border-radius:14px;padding:20px}
#mText{margin-bottom:14px}
#mInput{display:none;width:100%;height:44px;padding:0 10px;font:inherit;border:1px solid #ccc;border-radius:8px;margin-bottom:14px}
#mBtns{display:flex;gap:10px}
#mBtns button{flex:1;height:44px;border-radius:10px;font-weight:600;background:#f4f4f4}
#mYes{background:#111!important;color:#fff}
#toast{display:none;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;max-width:86vw;background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="app" class="view">
  <div id="bar">
    <button id="filterBtn"></button>
    <button id="addBtn" class="icon" aria-label="Add photos">+</button>
    <button id="menuBtn" class="icon" aria-label="Menu">⋮</button>
  </div>
  <div id="panel"><div id="rows"></div><div id="pfoot"></div></div>
  <div id="shade"></div>
  <div id="track"></div>
  <div id="empty"><div id="emptyMsg"></div><button id="emptyBtn"></button></div>
  <div id="viewAct" class="actions"><button id="editBtn">Edit tags</button><button id="delBtn">Delete</button></div>
  <div id="tagAct" class="actions"><button id="doneBtn">Done</button></div>
  <div id="menuBox"><button id="expBtn">Export backup</button><button id="impBtn">Import backup</button></div>
</div>
<div id="modal"><div id="card"><div id="mText"></div><input id="mInput" autocomplete="off"><div id="mBtns"><button id="mNo"></button><button id="mYes"></button></div></div></div>
<div id="toast"></div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="impFile" hidden>
<script>
const DEFAULT_TAGS=['Winter','Summer','Spring/Autumn','Japanese','Classic','Nautical','Workwear','Blues','Blacks','Earth tones','Formal'];
const MAX_SIDE=1600, PRELOAD=3;
const $=id=>document.getElementById(id);
let db,tags=[],photos=[],filter=new Set(),mode='view',queue=[],view=[],idx=0,manage=false,raf=0,returnId=null,toastTimer=0;
const urls=new Map();

/* ---------- storage ---------- */
const req=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const saveTags=()=>req(store('meta','readwrite').put(tags,'tags'));
const savePhoto=p=>req(store('photos','readwrite').put(p));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function urlOf(p){if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id)}
function dropUrl(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}

async function init(){
  db=await new Promise((ok,ko)=>{const r=indexedDB.open('wardrobe',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id'});r.result.createObjectStore('meta')};
    r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
  photos=await req(store('photos').getAll());
  const saved=await req(store('meta').get('tags'));
  tags=saved||DEFAULT_TAGS.slice();
  if(!saved)await saveTags();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render();
}

/* ---------- carousel ---------- */
const current=()=>view[idx];
function step(){const s=$('track').children;return s.length>1?s[1].offsetLeft-s[0].offsetLeft:$('track').clientWidth}

function render(keep){
  $('app').className=mode;
  view=mode==='tag'?queue:photos.filter(p=>[...filter].every(t=>p.tags.includes(t))).sort((a,b)=>b.added-a.added);
  const t=$('track');t.innerHTML='';
  view.forEach(()=>{const s=document.createElement('div');s.className='slide';
    const i=document.createElement('img');i.alt='';i.draggable=false;s.appendChild(i);t.appendChild(s)});
  if(!keep)idx=0;
  idx=Math.max(0,Math.min(idx,view.length-1));
  const none=!view.length;
  $('empty').style.display=none?'flex':'none';
  if(none){
    $('emptyMsg').textContent=photos.length?'No outfit has all of these tags.':'No outfits yet.';
    $('emptyBtn').textContent=photos.length?'Clear filters':'Add photos';
  }
  $('viewAct').style.display=mode==='view'?'flex':'none';
  $('tagAct').style.display=mode==='tag'?'flex':'none';
  $('editBtn').disabled=$('delBtn').disabled=none;
  $('addBtn').style.visibility=$('menuBtn').style.visibility=mode==='view'?'visible':'hidden';
  drawBar();drawPanel();
  requestAnimationFrame(()=>{t.scrollLeft=idx*step();animate();loadNear()});
}

function drawBar(){
  $('filterBtn').textContent=(mode==='tag'
    ?`Tag photo ${idx+1} of ${view.length}`
    :`${filter.size?[...filter].join(' + '):'All outfits'} (${view.length})`)+' ▾';
}

function loadNear(){
  [...$('track').children].forEach((s,k)=>{const img=s.firstChild;
    if(Math.abs(k-idx)<=PRELOAD){if(!img.getAttribute('src'))img.src=urlOf(view[k])}
    else if(img.getAttribute('src'))img.removeAttribute('src')});
}

function animate(){
  const t=$('track'),pos=t.scrollLeft/(step()||1);
  [...t.children].forEach((s,k)=>{const d=Math.min(1,Math.abs(k-pos));
    if(Math.abs(k-pos)<3){s.style.transform=`scale(${1-.08*d})`;s.style.opacity=1-.4*d}});
  return Math.round(pos);
}

$('track').addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
  const n=Math.max(0,Math.min(animate(),view.length-1));
  if(n!==idx){idx=n;loadNear();drawBar();if(mode==='tag')drawPanel()}})},{passive:true});

/* ---------- tag dropdown ---------- */
function drawPanel(){
  const rows=$('rows'),keepScroll=$('panel').scrollTop;
  rows.innerHTML='';rows.className=manage?'manage':'';
  const target=mode==='tag'?current():null;
  tags.forEach(t=>{
    const r=document.createElement('label');r.className='row';
    const c=document.createElement('input');c.type='checkbox';
    c.checked=mode==='tag'?!!(target&&target.tags.includes(t)):filter.has(t);
    c.onchange=async()=>{
      if(mode==='tag'){if(!target)return;
        target.tags=c.checked?[...target.tags,t]:target.tags.filter(x=>x!==t);await savePhoto(target)}
      else{c.checked?filter.add(t):filter.delete(t);render()}};
    const s=document.createElement('span');s.className='name';s.textContent=t;
    r.append(c,s);
    if(manage){
      const rn=document.createElement('button');rn.className='mini';rn.textContent='Rename';
      rn.onclick=e=>{e.preventDefault();renameTag(t)};
      const rm=document.createElement('button');rm.className='mini';rm.textContent='Remove';
      rm.onclick=e=>{e.preventDefault();removeTag(t)};
      r.append(rn,rm);
    }
    rows.appendChild(r);
  });
  const f=$('pfoot');f.innerHTML='';
  const btn=(txt,fn)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;f.appendChild(b)};
  if(mode==='view')btn('Clear',()=>{filter.clear();render();closePanel()});
  btn('+ New tag',newTag);
  btn(manage?'Finish':'Manage tags',()=>{manage=!manage;drawPanel()});
  $('panel').scrollTop=keepScroll;
}
const closePanel=()=>$('panel').classList.remove('open');

async function newTag(){
  const raw=await ask('New tag',{input:'',yes:'Add',no:'Cancel'});
  const n=(raw||'').trim();
  if(!n)return;
  if(tags.includes(n))return toast('That tag already exists');
  tags.push(n);await saveTags();
  if(mode==='tag'&&current()){current().tags.push(n);await savePhoto(current())}
  drawPanel();
}
async function renameTag(t){
  const raw=await ask('Rename tag',{input:t,yes:'Rename',no:'Cancel'});
  const n=(raw||'').trim();
  if(!n||n===t)return;
  if(tags.includes(n))return toast('That tag already exists');
  tags[tags.indexOf(t)]=n;await saveTags();
  for(const p of photos)if(p.tags.includes(t)){p.tags=p.tags.map(x=>x===t?n:x);await savePhoto(p)}
  if(filter.delete(t))filter.add(n);
  render(true);
}
async function removeTag(t){
  if(!await ask(`Remove the tag "${t}" from all outfits?`))return;
  tags=tags.filter(x=>x!==t);await saveTags();
  for(const p of photos)if(p.tags.includes(t)){p.tags=p.tags.filter(x=>x!==t);await savePhoto(p)}
  filter.delete(t);
  render(true);
}

/* ---------- adding photos ---------- */
function shrink(file){
  return new Promise((ok,ko)=>{
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,MAX_SIDE/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?ok(b):ko(new Error('encode')),'image/jpeg',.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('decode'))};
    img.src=u;
  });
}

$('pick').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  const added=[];let failed=0,base=Date.now();
  for(let i=0;i<files.length;i++){
    toast(`Adding photo ${i+1} of ${files.length}…`,true);
    try{const blob=await shrink(files[i]);
      const p={id:newId(),blob,tags:[],added:base+i};
      await savePhoto(p);photos.push(p);added.push(p);
    }catch(err){failed++}
  }
  toast(failed?`${failed} photo(s) could not be added`:'');
  if(!added.length)return render();
  filter.clear();returnId=null;
  startTagging(added);
};

function startTagging(list){
  queue=list;mode='tag';manage=false;
  $('panel').classList.add('open');
  render();
}

$('doneBtn').onclick=()=>{
  mode='view';queue=[];manage=false;closePanel();
  render();
  if(returnId){const k=view.findIndex(p=>p.id===returnId);if(k>=0){idx=k;render(true)}}
  returnId=null;
};
$('editBtn').onclick=()=>{const p=current();if(!p)return;returnId=p.id;startTagging([p])};
$('delBtn').onclick=async()=>{
  const p=current();if(!p)return;
  if(!await ask('Are you sure you want to delete this outfit?'))return;
  await req(store('photos','readwrite').delete(p.id));
  photos=photos.filter(x=>x.id!==p.id);dropUrl(p.id);
  render(true);
};

/* ---------- backup ---------- */
const toDataUrl=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(r.error);r.readAsDataURL(b)});

$('expBtn').onclick=async()=>{
  $('menuBox').classList.remove('open');
  try{
    const parts=['{"app":"wardrobe","version":1,"tags":'+JSON.stringify(tags)+',"photos":['];
    for(let i=0;i<photos.length;i++){
      toast(`Preparing backup ${i+1} of ${photos.length}…`,true);
      const {id,tags:t,added,blob}=photos[i];
      parts.push((i?',':'')+JSON.stringify({id,tags:t,added,image:await toDataUrl(blob)}));
    }
    parts.push(']}');
    const u=URL.createObjectURL(new Blob(parts,{type:'application/json'}));
    const a=document.createElement('a');a.href=u;
    a.download=`wardrobe-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
    toast(`Backup saved to Downloads (${photos.length} outfits)`);
  }catch(err){toast('Export failed')}
};

$('impBtn').onclick=()=>{$('menuBox').classList.remove('open');$('impFile').click()};
$('impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  try{
    toast('Importing…',true);
    const d=JSON.parse(await f.text());
    if(d.app!=='wardrobe'||!Array.isArray(d.photos))throw new Error('format');
    for(const t of d.tags||[])if(!tags.includes(t))tags.push(t);
    await saveTags();
    let n=0;
    for(const x of d.photos){
      const blob=await (await fetch(x.image)).blob();
      const p={id:x.id,blob,tags:x.tags||[],added:x.added||Date.now()};
      await savePhoto(p);dropUrl(p.id);
      const k=photos.findIndex(o=>o.id===p.id);
      if(k>=0)photos[k]=p;else photos.push(p);
      n++;
    }
    filter.clear();render();
    toast(`Imported ${n} outfits`);
  }catch(err){toast('That file is not a Wardrobe backup')}
};

/* ---------- small UI bits ---------- */
function ask(text,o={}){
  return new Promise(done=>{
    const hasInput=o.input!==undefined;
    $('mText').textContent=text;
    $('mInput').style.display=hasInput?'block':'none';
    $('mInput').value=hasInput?o.input:'';
    $('mYes').textContent=o.yes||'Yes';$('mNo').textContent=o.no||'No';
    $('modal').classList.add('open');
    if(hasInput)setTimeout(()=>$('mInput').focus(),30);
    const end=v=>{$('modal').classList.remove('open');$('mYes').onclick=$('mNo').onclick=null;done(v)};
    $('mYes').onclick=()=>end(hasInput?$('mInput').value:true);
    $('mNo').onclick=()=>end(hasInput?null:false);
  });
}
function toast(msg,stay){
  clearTimeout(toastTimer);
  const t=$('toast');t.textContent=msg;t.style.display=msg?'block':'none';
  if(msg&&!stay)toastTimer=setTimeout(()=>{t.style.display='none'},3000);
}
$('filterBtn').onclick=()=>{$('menuBox').classList.remove('open');$('panel').classList.toggle('open')};
$('shade').onclick=closePanel;
$('addBtn').onclick=()=>{closePanel();$('menuBox').classList.remove('open');$('pick').click()};
$('menuBtn').onclick=()=>{closePanel();$('menuBox').classList.toggle('open')};
$('track').addEventListener('pointerdown',()=>$('menuBox').classList.remove('open'),{passive:true});
$('emptyBtn').onclick=()=>{if(photos.length){filter.clear();render();closePanel()}else $('pick').click()};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init().catch(()=>toast('Could not open storage on this browser',true));
</script>
</body>
</html>
